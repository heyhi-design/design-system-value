# Runs the repository's one-command check on every push to the default branch and on
# every pull request. No network beyond the checkout, no secrets, no package installs:
# scripts/smoke.sh needs only bash, grep, shasum, and the Python 3 that ships on the
# runner (node is present there too, so the design-tool script parse step runs).
# Job name "smoke" is the required status check on the default branch; keep it stable.
name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Smoke check
        run: bash scripts/smoke.sh
